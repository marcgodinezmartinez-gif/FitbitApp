name: iOS

# Los minutos de macOS cuentan ×10 en un repositorio privado (≈ 200 al mes): esta compilación solo se lanza a mano,
# en main o con «[macos]» en el mensaje del commit (doc. 08 §6).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Firmar y subir a TestFlight"
        type: boolean
        default: false
      screenshots:
        description: "Capturas de pantalla en el simulador (modo demostración)"
        type: boolean
        default: true
  push:
    paths:
      - "App/**"
      - "Widgets/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SPM_DIR: .spm

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[macos]')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: XcodeGen y configuración
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          ./scripts/write-secrets-xcconfig.sh
          xcodegen generate

      - uses: actions/cache@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ hashFiles('Packages/RecuperaKit/Package.resolved') }}

      - name: Compilar para el simulador
        run: |
          set -o pipefail
          # Seguir compilando tras el primer error para ver todos los errores en una sola ejecución.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild build \
            -project Recupera.xcodeproj -scheme Recupera -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Capturas de pantalla
        if: (github.event_name == 'workflow_dispatch' && inputs.screenshots) || contains(github.event.head_commit.message, '[capturas]')
        run: ./scripts/screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Recupera.app screenshots

      - name: Publicar capturas
        if: (github.event_name == 'workflow_dispatch' && inputs.screenshots) || contains(github.event.head_commit.message, '[capturas]')
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: screenshots
          retention-days: 14

      - name: Resumen de errores
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        id: check
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID APP_BUNDLE_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Faltan secretos para TestFlight:$missing (ver docs/15-entorno-y-prerrequisitos.md §4)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcode, XcodeGen y configuración
        if: steps.check.outputs.ok == 'true'
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          ./scripts/write-secrets-xcconfig.sh
          xcodegen generate
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archivar (firma gestionada en la nube)
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Recupera.xcodeproj -scheme Recupera -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Recupera.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Subir a TestFlight
        if: steps.check.outputs.ok == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Recupera.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Resumen de errores
        if: failure()
        run: grep -E "error:" archive.log | sort -u | head -100 || true
